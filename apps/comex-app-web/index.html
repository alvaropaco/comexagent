<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>COMEX Agent - Intelligence for Commodities Trade</title>
    <script>
      (function() {
        const host = window.location.hostname;
        const targetHost = 'www.comexagent.com';
        const isInternalHost = host.endsWith('.run.app');

        if (isInternalHost && window.self === window.top) {
          window.location.href = 'https://' + targetHost + window.location.pathname + window.location.search;
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
