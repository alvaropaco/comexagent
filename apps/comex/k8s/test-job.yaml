apiVersion: batch/v1
kind: Job
metadata:
  name: comex-e2e-tests
  namespace: comex-test
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: tests
          image: comex-tests:local
          imagePullPolicy: IfNotPresent
          env:
            - name: PYTHONPATH
              value: /app
          command: ["python", "-m", "pytest", "-q"]
